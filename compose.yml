services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: galileo
      POSTGRES_USER: galileo
      POSTGRES_PASSWORD: galileo
    ports:
      - "5432:5432"
    volumes:
      - galileo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galileo -d galileo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - galileo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  galileo-postgres:
  galileo-redis:
