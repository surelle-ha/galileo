spring:
  datasource:
    url: jdbc:h2:mem:galileo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: none

app:
  security:
    jwt:
      secret: test-only-secret-with-at-least-thirty-two-characters
      access-token-ttl: PT15M
  bootstrap:
    enabled: true
    admin-email: admin@test.local
    admin-password: TestAdmin123!

logging:
  level:
    org.hibernate.SQL: WARN
